Naming/BlockParameterName:
  Description: Disallows non-descriptive block parameter names
  MinNameLength: 1
  AllowNamesEndingInNumbers: true
  ForbiddenNames: []
  Enabled: true
  Severity: Convention

Documentation/DocumentationAdmonition:
  Excluded:
    - src/**/**
    - spec/**/**
  Enabled: true

# Generated AUR packaging snapshot (created by do_aur.sh during releases);
# it contains full copies of the source tree and its own vendored libs.
# Note: setting Excluded replaces ameba's default ("lib"), so keep it.
Excluded:
  - lib
  - aur-hace/**/*
